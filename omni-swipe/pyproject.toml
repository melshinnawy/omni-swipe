[project]
name = "omniswipe"
version = "0.1.0"
description = "Discover, classify and map sensitive data across systems through one Universal Data Model"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
omniswipe = "omniswipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniswipe*"]
